version: '3.8'

services:
  # ==========================================================
  # PostgreSQL 16 Relational Database Engine
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: nextlevelcheat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xivam}
      POSTGRES_DB: ${POSTGRES_DB:-nextlevelcheat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nextlevelcheat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nlc_network

  # ==========================================================
  # High-Security FastAPI Application Server
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextlevelcheat_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-xivam}@postgres:5432/${POSTGRES_DB:-nextlevelcheat}
      ENVIRONMENT: production
      DEBUG: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - nlc_network

networks:
  nlc_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
